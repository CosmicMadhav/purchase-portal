name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/cosmicmadhav/purchase-portal:latest .
      - name: Run tests inside the image (LibreOffice PDF export included)
        run: docker run --rm ghcr.io/cosmicmadhav/purchase-portal:latest sh -c "pip install -q pytest && python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_ui.py"
      - name: Publish (only when tests pass, only from main)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/cosmicmadhav/purchase-portal:latest
